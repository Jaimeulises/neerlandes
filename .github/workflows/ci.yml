name: Integración continua

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    name: Tipos, lint, pruebas, contenido y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
